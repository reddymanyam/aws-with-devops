# Pod
apiVersion: v1
kind: Pod
metadata:
  name: hello-world-pod
spec:
  containers:
    - name: hello-world
      image: hello-world-image:latest
      imagePullPolicy: Never
      command: ["/bin/sh"]
      args: ["-c", "./helloworld.sh"]

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: hello-world
          image: hello-world-image:latest
          imagePullPolicy: Never
          command: ["/bin/sh"]
          args: ["-c", "./helloworld.sh"]

---
# Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: hello-world-service
spec:
  selector:
    app: hello-world
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-world-config
data:
  message: "Hello from ConfigMap"

---
# Secret
apiVersion: v1
kind: Secret
metadata:
  name: hello-world-secret
stringData:
  username: admin
  password: secret123

---
# StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hello-world-statefulset
spec:
  serviceName: "hello"
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: hello-world
          image: hello-world-image:latest
          imagePullPolicy: Never
          command: ["/bin/sh"]
          args: ["-c", "./helloworld.sh"]

---
# DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hello-world-daemonset
spec:
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: hello-world
          image: hello-world-image:latest
          imagePullPolicy: Never
          command: ["/bin/sh"]
          args: ["-c", "./helloworld.sh"]

---
# Job
apiVersion: batch/v1
kind: Job
metadata:
  name: hello-world-job
spec:
  template:
    spec:
      containers:
        - name: hello-world
          image: hello-world-image:latest
          imagePullPolicy: Never
          command: ["/bin/sh"]
          args: ["-c", "./helloworld.sh"]
      restartPolicy: Never

---
# CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-world-cronjob
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: hello-world
              image: hello-world-image:latest
              imagePullPolicy: Never
              command: ["/bin/sh"]
              args: ["-c", "./helloworld.sh"]
          restartPolicy: OnFailure

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-world-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: hello.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-world-service
                port:
                  number: 80
